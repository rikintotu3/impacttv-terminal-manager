<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16345c">
<title>impactTV 端末管理</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="端末管理">
<style>
:root{
  --bg:#eef2f7;--card:#ffffff;--ink:#0e1a2b;--sub:#33415c;--muted:#64748b;--line:#dde4ec;
  --primary:#16345c;--primary-ink:#ffffff;--accent:#f5b70a;--accent-ink:#1a2b45;--focus:#2f6fed;
  --ok:#15803d;--warn:#b45309;--danger:#dc2626;--info:#1d4ed8;
  --ok-bg:#e7f5ec;--warn-bg:#fdf3e0;--danger-bg:#fdeaea;--info-bg:#e8effd;--chip-on:#e3ecfb;
  --radius:18px;--shadow:0 1px 2px rgba(16,42,67,.05),0 8px 24px rgba(16,42,67,.07);
  --font:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b1220;--card:#131c2e;--ink:#e8eef6;--sub:#c3cedc;--muted:#93a1b5;--line:#2a3750;
    --primary:#6d9be0;--primary-ink:#08111f;--accent:#f5b70a;--accent-ink:#1a2b45;--focus:#93c5fd;
    --ok:#4ade80;--warn:#fbbf24;--danger:#f87171;--info:#93b4ff;
    --ok-bg:#10301e;--warn-bg:#33260a;--danger-bg:#3a1515;--info-bg:#15254a;--chip-on:#1b2d52;
    --shadow:none;color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.i{width:22px;height:22px;flex:0 0 auto}
.file{position:absolute;left:-200px;top:0;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

/* top bar */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:2px;min-height:56px;padding:env(safe-area-inset-top) 6px 0;background:linear-gradient(135deg,#16345c 0%,#1e4a86 100%);color:#fff}
@media (prefers-color-scheme:dark){.bar{background:#0f1a2e;border-bottom:1px solid var(--line)}}
.bar-title{flex:1;font-weight:700;font-size:17px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:48px;height:48px;border:0;border-radius:12px;background:transparent;color:inherit;display:grid;place-items:center}
.icon-btn:active{background:rgba(255,255,255,.12)}
.view{max-width:560px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}

/* blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin:0 0 12px}
.sec{font-size:15px;color:var(--sub);margin:22px 4px 8px;display:flex;align-items:baseline;gap:8px}
.sec small{color:var(--muted);font-weight:400}
.hello{margin:2px 4px 12px;color:var(--sub);font-weight:600}
.tip{margin:8px 4px 16px;color:var(--muted);font-size:14px;text-align:center}
.hint{margin:6px 0 12px;color:var(--muted);font-size:13px}
.empty{color:var(--muted);text-align:center;padding:16px 8px}
.foot{margin:28px 0 0;color:var(--muted);font-size:13px;text-align:center}
.mono{font-family:var(--mono);letter-spacing:.02em}
.warn-text{color:var(--warn)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 10px}
.stack{display:grid;gap:10px}
.linklike{border:0;background:none;color:var(--info);padding:6px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.linklike .i{width:16px;height:16px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:16px;text-align:center;text-decoration:none;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#fff}
@media (prefers-color-scheme:dark){.btn.danger,.btn.okb{color:#0b1220}}
.btn.ghost{background:transparent;box-shadow:none}
.btn.small{width:auto;min-height:44px;padding:6px 12px;font-size:14px;border-radius:12px;box-shadow:none}
.btn.hero{min-height:96px;font-size:21px;border-radius:22px;flex-direction:column;gap:2px;margin-top:4px}
.btn.hero .i{width:34px;height:34px}
.btn.hero small{font-size:13px;font-weight:500;opacity:.85}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.left{justify-content:flex-start;text-align:left}
.btn .grow{flex:1}

/* notes */
.note{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border-radius:14px;padding:12px 14px;margin:0 0 12px;border:1px solid transparent;font-size:14px;line-height:1.55;color:var(--ink)}
.note .i{margin-top:1px}
.note.info{background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.note.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.note.danger{background:var(--danger-bg);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.note.ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
button.note{font:inherit;cursor:pointer}

/* status */
.badge{display:inline-flex;align-items:center;gap:6px;padding:1px 10px 1px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap;color:var(--ink)}
.badge i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:0 0 auto}
.pill{display:inline-flex;align-items:center;padding:6px 16px;border-radius:999px;background:var(--c);color:#fff;font-weight:800;font-size:17px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{display:flex;align-items:center;gap:8px;min-height:52px;padding:8px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:left;box-shadow:var(--shadow)}
.stat i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:0 0 auto}
.stat span{flex:1;font-size:13px;line-height:1.3;color:var(--sub)}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.stat.zero b{color:var(--muted);font-weight:500}

/* lists */
.list{padding:4px 0}
.li{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
button.li,.li-main{display:flex;flex-direction:column;align-items:stretch;gap:2px;flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:0}
button.li{padding:10px 14px;width:100%;border-bottom:1px solid var(--line)}
.li-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}
.li-sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.kind{flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800}
.kind.ok{background:var(--ok-bg);color:var(--ok)}
.kind.moved{background:var(--warn-bg);color:var(--warn)}
.kind.new{background:var(--info-bg);color:var(--info)}
.kind .i{width:20px;height:20px}
.x-btn{flex:0 0 auto;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--muted)}

/* device card */
.serial{font-family:var(--mono);font-size:26px;font-weight:800;letter-spacing:.03em;word-break:break-all;line-height:1.25;margin:2px 0 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0 0;font-size:15px}
.kv dt{color:var(--muted);font-size:13px;padding-top:2px}
.kv dd{margin:0;word-break:break-word}
.place{font-size:18px;font-weight:700;margin:10px 0 0;display:flex;gap:6px;align-items:flex-start}
.place .i{margin-top:3px;color:var(--muted)}
.hist{padding:0}
.hist li{list-style:none;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.hist li:last-child{border-bottom:0}
.hist .h-top{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.hist .h-sub{color:var(--muted);font-size:13px}
.hist .undone{text-decoration:line-through;opacity:.6}
.loading{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin:4px 0}

/* form */
.field{display:block;margin:0 0 14px}
.field>span,.label{display:block;font-weight:700;font-size:14px;margin:0 0 6px;color:var(--sub)}
.req{color:var(--danger);font-size:12px;margin-left:4px}
input[type=text],input[type=password],input[type=search],select,textarea{width:100%;min-height:52px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:17px}
textarea{min-height:88px;resize:vertical;line-height:1.5}
input.big{font-family:var(--mono);font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;display:inline-flex;align-items:center;gap:8px;text-align:left}
.chip i.dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{border-color:var(--primary);background:var(--chip-on);box-shadow:inset 0 0 0 1.5px var(--primary)}
.chip.status[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1.5px var(--c)}
.chip small{display:block;font-weight:400;font-size:12px;color:var(--muted);line-height:1.3}
.chips.col{flex-direction:column}
.chips.col .chip{width:100%}
.picker{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);text-align:left;font-size:17px;font-weight:700}
.picker .grow{flex:1}
.picker .ph{color:var(--muted);font-weight:500}
.photos{display:flex;gap:10px;flex-wrap:wrap}
.thumb{position:relative;width:92px;height:92px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-weight:800}
.thumb.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--sub);border-style:dashed;cursor:pointer}
.sticky-actions{position:sticky;bottom:0;padding:12px 0 calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);margin-top:8px}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;font-weight:600}
.check input{width:24px;height:24px;margin-top:1px;flex:0 0 auto;accent-color:var(--primary)}
.search-row{position:relative}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{white-space:nowrap;min-height:40px;padding:6px 12px;font-size:14px}

/* done */
.done-mark{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;margin:12px auto 10px;background:var(--ok-bg);color:var(--ok)}
.done-mark .i{width:48px;height:48px;stroke-width:2.6}
.done-title{text-align:center;font-size:21px;margin:0 0 4px}
.center{text-align:center}
.progress{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 2px}
.progress i{display:block;height:100%;background:var(--ok);border-radius:99px}
.flash{border-radius:14px;padding:12px 14px;margin:0 0 12px;font-weight:700;display:flex;gap:10px;align-items:center}
.flash.ok{background:var(--ok-bg);color:var(--ok)}
.flash.moved,.flash.dup,.flash.bad{background:var(--warn-bg);color:var(--warn)}
.flash.new{background:var(--info-bg);color:var(--info)}
.flash .mono{color:var(--ink)}
details.card>summary{cursor:pointer;font-weight:700;min-height:32px;list-style-position:inside}

/* overlays */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.38);display:grid;place-items:center;padding:20px}
.busy-box{background:var(--card);color:var(--ink);padding:18px 22px;border-radius:16px;display:flex;gap:14px;align-items:center;max-width:320px;white-space:pre-line;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--primary);animation:spin .8s linear infinite;flex:0 0 auto}
.spinner.sm{width:16px;height:16px;border-width:2px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);z-index:90;background:#0f172a;color:#fff;padding:10px 10px 10px 16px;border-radius:14px;display:flex;gap:10px;align-items:center;width:max-content;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.3);font-weight:600}
@media (prefers-color-scheme:dark){.toast{background:#e8eef6;color:#0b1220}.toast button{color:#1d4ed8!important}}
.toast button{border:0;background:transparent;color:#7dd3fc;font-weight:800;min-height:40px;padding:0 8px;white-space:nowrap}
.modal{position:fixed;inset:0;z-index:70;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.sheet.tall{height:92vh;display:flex;flex-direction:column}
.sheet h3{margin:0 0 8px;font-size:19px}
.sheet .body{margin:0 0 16px;color:var(--sub);white-space:pre-line}
.sheet .scroll{flex:1;overflow:auto;margin:8px -16px 0;padding:0 16px}
@media (min-width:720px){.modal{align-items:center}.sheet{border-radius:22px}}

/* scanner */
.scanner{position:fixed;inset:0;z-index:60;background:#000;color:#fff;overflow:hidden}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan-frame{position:absolute;left:50%;top:44%;width:min(84vw,440px);height:min(62vw,320px);transform:translate(-50%,-50%);border-radius:20px;box-shadow:0 0 0 200vmax rgba(0,0,0,.45);border:3px solid rgba(255,255,255,.92);transition:border-color .15s}
.scan-frame.hit{border-color:#4ade80}
.scan-line{position:absolute;left:6%;right:6%;top:50%;height:2px;background:#fb7185;box-shadow:0 0 8px #fb7185;animation:sweep 1.8s ease-in-out infinite alternate}
@keyframes sweep{from{top:12%}to{top:88%}}
.scan-top{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:linear-gradient(rgba(0,0,0,.7),transparent)}
.scan-top .t{font-weight:700;text-align:center;flex:1}
.scan-bottom{position:absolute;left:0;right:0;bottom:0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.8) 30%)}
.scan-hint{text-align:center;font-weight:700;margin:0 0 10px;text-shadow:0 1px 3px #000}
.scan-last{min-height:48px;border-radius:12px;padding:10px 12px;margin:0 0 10px;background:rgba(255,255,255,.14);font-weight:700;text-align:center}
.scan-last.ok{background:rgba(22,163,74,.85)}
.scan-last.warn{background:rgba(202,138,4,.9)}
.scan-btn{min-height:48px;padding:8px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(15,23,42,.55);color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;cursor:pointer}
.scan-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scan-actions .wide{grid-column:1 / -1;background:#fff;color:#0f172a;border-color:#fff}
@media (prefers-reduced-motion:reduce){.scan-line,.spinner{animation:none}.btn:active{transform:none}}

/* v2: ブランド・デモ表示・画面遷移・ボトムナビ */
.bar-logo{display:grid;place-items:center;width:32px;height:32px;margin-left:6px;flex:0 0 auto}
.bar-logo svg{width:22px;height:22px}
.demo-pill{flex:0 0 auto;margin:0 4px;padding:3px 11px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;letter-spacing:.03em}
.btn.hero.scan{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 8px 20px rgba(245,183,10,.35)}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.view-enter{animation:viewIn .22s ease}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;align-items:center;height:calc(62px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(16,42,67,.06)}
.tabbar[hidden]{display:none}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:64px;height:100%;padding:6px 8px 0;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:600}
.tab .i{width:24px;height:24px}
.tab.on{color:var(--primary);font-weight:800}
.tab-gap{width:72px;flex:0 0 auto}
.tab-fab{position:absolute;left:50%;top:0;margin-top:-22px;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;border:4px solid var(--bg);background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 16px rgba(245,183,10,.4);cursor:pointer;padding:0}
.tab-fab:active{transform:translateX(-50%) scale(.94)}
.tab-fab .i{width:26px;height:26px}
body.tabbar-on .view{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
@media (prefers-reduced-motion:reduce){.view-enter{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <button class="icon-btn" id="btnBack" type="button" aria-label="戻る" hidden></button>
    <span class="bar-logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#f5b70a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5v14M7 5v14M10.5 5v14M14 5v14M16.5 5v14M20 5v14"/></svg></span>
    <div class="bar-title" id="barTitle">impactTV 端末管理</div>
    <span class="demo-pill" id="demoPill" hidden>デモ</span>
    <button class="icon-btn" id="btnSettings" type="button" aria-label="設定" hidden></button>
  </header>
  <main id="view" class="view" tabindex="-1"><div class="loading"><span class="spinner sm"></span>読み込み中…</div></main>
</div>

<div id="busy" class="overlay" hidden><div class="busy-box"><span class="spinner"></span><span id="busyText">通信中…</span></div></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="modal" class="modal" hidden></div>

<section id="scanner" class="scanner" hidden aria-label="バーコード読み取り">
  <video id="video" playsinline muted autoplay></video>
  <div class="scan-frame" id="scanFrame"><div class="scan-line"></div></div>
  <div class="scan-top">
    <button class="scan-btn" id="scanClose" type="button">閉じる</button>
    <div class="t" id="scanTitle">読み取り</div>
    <button class="scan-btn" id="scanTorch" type="button" hidden>ライト</button>
  </div>
  <div class="scan-bottom">
    <p class="scan-hint" id="scanHint">黄色いシールのバーコードを枠に入れてください</p>
    <div class="scan-last" id="scanLast" hidden></div>
    <div class="scan-actions">
      <label class="scan-btn" for="camInput">撮影して読み取る</label>
      <button class="scan-btn" id="scanManual" type="button">番号を入力</button>
      <button class="scan-btn wide" id="scanDone" type="button" hidden>読み取りを終える</button>
    </div>
  </div>
</section>

<input type="file" id="camInput" class="file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">

<script>
(function () {
'use strict';

/* =========================================================

}, window.ITV_CONFIG || {});

var APP_VERSION = '2.0.1';
var IS_GAS = !!(window.google && google.script && google.script.run);
var MODE = IS_GAS ? 'gas' : (CONFIG.API_URL ? 'web' : (window.__MOCK_API__ ? 'mock' : 'none'));
var SERIAL_RE = /^[A-Z0-9\-_.\/+]{1,40}$/;
var STRONG_FORMATS = ['code_128', 'qr_code', 'data_matrix', 'ean_13', 'ean_8', 'upc_a'];

/* ---------- アイコン ---------- */
function svg(d) { return '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>'; }

  list: svg('<path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/>'),

  check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  alert: svg('<path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.5h.01"/>'),

  search: svg('<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>'),
  pin: svg('<path d="M12 21s7-6.2 7-11.5a7 7 0 10-14 0C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/>'),
  plus: svg('<path d="M12 5v14M5 12h14"/>'),
  x: svg('<path d="M6 6l12 12M18 6L6 18"/>'),
  refresh: svg('<path d="M20 11a8 8 0 10-2.4 5.8"/><path d="M20 4.5V11h-6.5"/>'),
  repeat: svg('<path d="M4 12a8 8 0 0113.7-5.6L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 01-13.7 5.6L4 15"/><path d="M4 20v-5h5"/>'),
  question: svg('<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-.9.6-1.5 1.1-1.5 2.2M12 17h.01"/>'),
  chevron: svg('<path d="M9 5l7 7-7 7"/>')
};

/* ---------- 小さな道具 ---------- */
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function newId() {
  try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* 下へ */ }
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}
function nfkc(v) { var s = String(v == null ? '' : v); try { s = s.normalize('NFKC'); } catch (e) { /* 古いブラウザ */ } return s; }
function normSerial(v) { return nfkc(v).replace(/[\x00-\x1F\x7F\s]/g, '').toUpperCase(); }
function normKey(v) { return nfkc(v).replace(/\s+/g, '').toUpperCase(); }
function uniq(a) { var seen = {}; return a.filter(function (x) { if (seen[x]) return false; seen[x] = 1; return true; }); }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function fmtDate(ms, dateOnly) {
  if (!ms) return '';
  var d = new Date(ms);
  return d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()) + (dateOnly ? '' : ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()));
}
function ago(ms) {
  if (!ms) return '';
  var m = Math.floor((Date.now() - ms) / 60000);
  if (m < 1) return 'たった今';
  if (m < 60) return m + '分前';
  var h = Math.floor(m / 60);
  if (h < 24) return h + '時間前';
  var days = Math.floor(h / 24);
  if (days < 30) return days + '日前';
  return fmtDate(ms, true);
}

var store = {
  get: function (k, d) { try { var v = localStorage.getItem('itv.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem('itv.' + k, JSON.stringify(v)); } catch (e) { /* 保存できない環境 */ } },
  del: function (k) { try { localStorage.removeItem('itv.' + k); } catch (e) { /* 何もしない */ } }
};

/* ---------- 状態 ---------- */
var st = {
  token: store.get('token', ''),
  user: store.get('user', ''),
  deviceId: store.get('deviceId', ''),
  scanMode: store.get('scanMode', 'auto'),
  recentStores: store.get('recentStores', []),
  ops: store.get('ops', []),
  inv: store.get('inv', null),
  boot: null,
  devices: new Map(),
  statusMap: new Map(),
  stack: [],
  cur: null,
  form: null,
  listFilter: null,
  liveFailed: false,
  lastBoot: 0,
  deferredInstall: null
};
if (!st.deviceId) { st.deviceId = newId(); store.set('deviceId', st.deviceId); }

function deviceLabel() {
  var ua = navigator.userAgent || '';
  var os = /iPhone/.test(ua) ? 'iPhone' : (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) ? 'iPad' :
    /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows' : /Mac OS/.test(ua) ? 'Mac' : 'その他';
  var br = /Line\//.test(ua) ? 'LINE' : /WorksMobile|LINEWORKS/i.test(ua) ? 'LINE WORKS' : /EdgA?\//.test(ua) ? 'Edge' :
    /CriOS|Chrome\//.test(ua) ? 'Chrome' : /FxiOS|Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : 'ブラウザ';
  return os + ' / ' + br;
}

/* =========================================================
 * サーバーとの通信
 * ========================================================= */
function AppError(code, message, extra) { var e = new Error(message); e.code = code; e.extra = extra; return e; }

function api(action, payload) {
  var req = { action: action, payload: payload || {}, token: st.token, user: st.user, device: { id: st.deviceId, label: deviceLabel() }, v: APP_VERSION };
  return new Promise(function (resolve, reject) {
    function done(res) {
      if (typeof res === 'string') { try { res = JSON.parse(res); } catch (e) { res = null; } }
      if (!res || typeof res !== 'object') return reject(AppError('SERVER', 'サーバーから正しい応答がありませんでした。時間をおいて試してください。'));
      if (res.ok) return resolve(res.data);
      reject(AppError(res.code || 'SERVER', res.message || 'エラーが発生しました。', res.extra));
    }
    function fail(err) {
      reject(AppError('NETWORK', '電波の良い場所で、もう一度お試しください。', String(err && err.message || err)));
    }
    try {
      if (MODE === 'gas') google.script.run.withSuccessHandler(done).withFailureHandler(fail).api(req);
      else if (MODE === 'web') fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(req), redirect: 'follow' }).then(function (r) { return r.text(); }).then(done, fail);
      else if (MODE === 'mock') Promise.resolve(window.__MOCK_API__(req)).then(done, fail);
      else reject(AppError('CONFIG', '接続先が設定されていません（CONFIG.API_URL）。'));
    } catch (e) { fail(e); }
  });
}

var busyTimer = null;
function showBusy(text) {
  $('#busyText').textContent = text || '通信中…';
  $('#busy').hidden = false;
  clearTimeout(busyTimer);
  busyTimer = setTimeout(function () { $('#busyText').textContent = (text || '通信中…') + '\n時間がかかっています。そのままお待ちください。'; }, 9000);
}
function hideBusy() { clearTimeout(busyTimer); $('#busy').hidden = true; }

async function run(fn, busyText) {
  showBusy(busyText);
  try { return await fn(); }
  catch (e) { handleError(e); throw e; }
  finally { hideBusy(); }
}

var ERROR_TITLES = {
  NETWORK: '通信できませんでした', BAD_PASS: '合言葉が違います', LOCKED: 'しばらくお待ちください', BUSY: '混み合っています',
  DUPLICATE_ROWS: '台帳に同じ番号が複数あります', UNDO_EXPIRED: '取り消せません', UNDO_NOT_FOUND: '取り消せません',
  BAD_LOCATION: '設置場所を確認してください', BAD_STATUS: '状態を確認してください', BAD_SERIAL: '番号を確認してください',
  SETUP: '初期設定が必要です', BAD_PHOTO: '写真を送れませんでした', CONFIG: '設定が必要です'
};
function handleError(e) {
  if (e.code === 'AUTH') {
    st.token = ''; store.del('token');
    go('login', { message: e.message }, { root: true });
    return;
  }
  if (e.code === 'NO_NAME') { go('login', { message: e.message }, { root: true }); return; }
  alertModal(ERROR_TITLES[e.code] || 'エラー', e.message);
}

async function loadBoot() {
  var b = await api('bootstrap');
  st.boot = b;
  st.devices = new Map(b.devices.map(function (d) { return [d.s, d]; }));
  st.statusMap = new Map(b.statuses.map(function (s) { return [s.name, s]; }));
  st.lastBoot = Date.now();
  if (document.title !== b.settings.appName) document.title = b.settings.appName;
  return b;
}
function refreshBootQuietly() {
  if (!st.token || Date.now() - st.lastBoot < 60000) return;
  loadBoot().then(function () { if (topName() === 'home') render(); }, function () { /* 無視 */ });
}

/* ---------- マスタの道具 ---------- */
function appName() { return (st.boot && st.boot.settings.appName) || document.title || 'impactTV 端末管理'; }
function statusInfo(name) { return st.statusMap.get(name) || { name: name || '（未設定）', kind: '', color: '#64748b', desc: '' }; }
function kindOf(name) { return statusInfo(name).kind; }
function statusByKind(kind) { var s = st.boot.statuses.filter(function (x) { return x.kind === kind; })[0]; return s ? s.name : null; }
function normalStatus() { return statusByKind('正常') || st.boot.statuses[0].name; }
function badge(name) { var s = statusInfo(name); return '<span class="badge" style="--c:' + esc(s.color) + '"><i></i>' + esc(s.name) + '</span>'; }
function pill(name) { var s = statusInfo(name); return '<span class="pill" style="--c:' + esc(s.color) + '">' + esc(s.name) + '</span>'; }
function staleMs() { return st.boot.settings.staleDays * 86400000; }
function isStale(c) { return kindOf(c.st) !== '終了' && (!c.ck || Date.now() - c.ck > staleMs()); }
function inferModel(serial) {
  var best = null;
  (st.boot.models || []).forEach(function (m) { if (serial.indexOf(m.prefix) === 0 && (!best || m.prefix.length > best.prefix.length)) best = m; });
  return best ? best.name : '';
}
function patternOk(serial) {
  var p = st.boot.settings.serialPattern;
  if (!p) return true;
  try { return new RegExp(p).test(serial); } catch (e) { return true; }
}
function fromCompact(c) {
  return { serial: c.s, location: c.l, spot: c.p, status: c.st, symptom: c.sy, model: c.m, contract: c.c, memo: c.n,
    checkedAt: c.ck, checkedBy: c.cb, updatedAt: c.up, updatedBy: c.ub, rev: c.r, photos: [] };
}
function cacheDevice(d) {
  st.devices.set(d.serial, { s: d.serial, l: d.location, p: d.spot, st: d.status, sy: d.symptom, m: d.model, c: d.contract,
    n: d.memo, ck: d.checkedAt, cb: d.checkedBy, up: d.updatedAt, ub: d.updatedBy, r: d.rev, ph: d.photos && d.photos.length ? 1 : 0 });
}
function rememberStore(name) {
  if (!name) return;
  st.recentStores = uniq([name].concat(st.recentStores)).slice(0, 6);
  store.set('recentStores', st.recentStores);
}
function storeNames() { return st.boot.stores.map(function (s) { return s.name; }); }

/* =========================================================
 * 画面遷移
 * ========================================================= */
var screens = {};
var acts = {};
var modalActs = {};
var histDepth = 0;

function topName() { var t = st.stack[st.stack.length - 1]; return t ? t.name : ''; }
function topParams() { var t = st.stack[st.stack.length - 1]; return (t && t.params) || {}; }

function go(name, params, opts) {
  opts = opts || {};
  if (opts.root) st.stack = [{ name: name, params: params || {} }];
  else if (opts.replace && st.stack.length) st.stack[st.stack.length - 1] = { name: name, params: params || {} };
  else { st.stack.push({ name: name, params: params || {} }); histPush(name); }
  render();
}
function back() {
  if (st.stack.length > 1) { st.stack.pop(); render(); }
  else if (topName() !== 'home' && st.boot) go('home', null, { root: true });
}
function render() {
  var t = st.stack[st.stack.length - 1];
  closeModal();
  acts = {};
  var noNav = t.name === 'login' || t.name === 'error';
  $('#btnBack').hidden = st.stack.length <= 1 || noNav;
  $('#btnSettings').hidden = noNav || t.name === 'settings';
  $('#demoPill').hidden = MODE !== 'mock';
  var tabOn = !noNav && ['home', 'search', 'list', 'settings'].indexOf(t.name) >= 0;
  document.body.classList.toggle('tabbar-on', tabOn);
  $('#tabbar').hidden = !tabOn;
  var curTab = { home: 'home', list: 'list', settings: 'settings' }[t.name] || '';
  $$('#tabbar .tab').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === curTab); });
  screens[t.name](t.params || {});
  window.scrollTo(0, 0);
}
function setView(html, title) {
  var v = $('#view');
  v.innerHTML = html;
  $('#barTitle').textContent = title || appName();
  v.classList.remove('view-enter');
  void v.offsetWidth;
  v.classList.add('view-enter');
}
function histPush(name) {
  try {
    histDepth++;
    if (MODE === 'gas' && google.script.history) google.script.history.push({ d: histDepth }, {}, name);
    else if (window.history && history.pushState) history.pushState({ d: histDepth }, '', '#' + name);
  } catch (e) { /* 何もしない */ }
}
function onHistoryBack() {
  if (!$('#scanner').hidden) { Live.close(); return; }
  if (!$('#modal').hidden) { closeModal(); return; }
  if (st.stack.length > 1) { st.stack.pop(); render(); }
}

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var name = el.getAttribute('data-act');
  var fn = (!$('#modal').hidden && modalActs[name]) || acts[name] || globalActs[name];
  if (!fn) return;
  if (el.tagName !== 'LABEL' && el.tagName !== 'SUMMARY') e.preventDefault();
  fn(el, e);
});

var globalActs = {
  openSerial: function (el) { openSerial(el.getAttribute('data-serial')); },
  undo: function (el) { doUndo(el.getAttribute('data-op')); },
  goHome: function () { go('home', null, { root: true }); },
  goSearch: function () { go('search'); },
  goList: function () { st.listFilter = null; go('list'); },
  goInv: function () { go('invPick'); },
  resumeInv: function () { go('inv'); },
  scan: function () { startScan(); },
  refresh: function () { run(loadBoot, '最新の情報を読み込み中…').then(function () { render(); toast('最新の情報にしました'); }, function () {}); },
  listStatus: function (el) { st.listFilter = null; go('list', { status: el.getAttribute('data-status') }); },
  listStale: function () { st.listFilter = null; go('list', { stale: true }); }
};

/* =========================================================
 * トースト・モーダル
 * ========================================================= */
var toastTimer = null;
function toast(text, action, ms) {
  var t = $('#toast');
  t.innerHTML = '<span>' + esc(text) + '</span>' + (action ? '<button type="button" id="toastAct">' + esc(action.label) + '</button>' : '');
  t.hidden = false;
  if (action) $('#toastAct').onclick = function () { t.hidden = true; action.fn(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.hidden = true; }, ms || (action ? 8000 : 3000));
}

var modalResolve = null;
function openModal(html, actsMap, opts) {
  opts = opts || {};
  var m = $('#modal');
  m.innerHTML = '<div class="sheet' + (opts.tall ? ' tall' : '') + '" role="dialog" aria-modal="true">' + html + '</div>';
  m.hidden = false;
  modalActs = actsMap || {};
  m.onclick = function (e) { if (e.target === m && !opts.sticky) closeModal(); };
  var f = $('[data-autofocus]', m);
  if (f) setTimeout(function () { f.focus(); }, 60);
}
function closeModal(value) {
  var m = $('#modal');
  if (m.hidden) return;
  m.hidden = true;
  m.innerHTML = '';
  modalActs = {};
  if (modalResolve) { var r = modalResolve; modalResolve = null; r(value); }
}
function alertModal(title, text) {
  openModal('<h3>' + esc(title) + '</h3><p class="body">' + esc(text) + '</p><button class="btn primary" data-act="ok">OK</button>', { ok: function () { closeModal(); } });
}
function confirmModal(title, text, okLabel, danger) {
  return new Promise(function (resolve) {
    openModal('<h3>' + esc(title) + '</h3><p class="body">' + esc(text) + '</p><div class="stack">' +
      '<button class="btn ' + (danger ? 'danger' : 'primary') + '" data-act="yes">' + esc(okLabel || 'OK') + '</button>' +
      '<button class="btn ghost" data-act="no">やめる</button></div>',
      { yes: function () { closeModal(true); }, no: function () { closeModal(false); } });
    modalResolve = resolve;
  });
}

/* 設置場所の選択 */
function pickStore(title, current) {
  return new Promise(function (resolve) {
    var names = storeNames();
    var recent = st.recentStores.filter(function (n) { return names.indexOf(n) >= 0; });
    function itemHtml(n) {
      return '<button class="btn left" data-act="pick" data-name="' + esc(n) + '">' + I.pin + '<span class="grow">' + esc(n) + '</span>' +
        (n === current ? '<span class="badge"><i style="background:var(--ok)"></i>いま</span>' : '') + '</button>';
    }
    function listHtml(q) {
      var k = normKey(q);
      var hit = names.filter(function (n) { return !k || normKey(n).indexOf(k) >= 0; });
      var html = '';
      if (!k && recent.length) html += '<p class="label">最近使った場所</p><div class="stack">' + recent.map(itemHtml).join('') + '</div><p class="label" style="margin-top:14px">すべての場所</p>';
      html += hit.length ? '<div class="stack">' + hit.map(itemHtml).join('') + '</div>' : '<p class="empty">見つかりません</p>';
      return html;
    }
    openModal('<h3>' + esc(title) + '</h3>' +
      '<input type="search" id="storeQ" placeholder="店舗名で絞り込み" autocomplete="off">' +
      '<div class="scroll" id="storeList">' + listHtml('') + '</div>' +
      '<button class="btn ghost" data-act="cancel" style="margin-top:10px">やめる</button>',
      {
        pick: function (el) { var n = el.getAttribute('data-name'); rememberStore(n); closeModal(n); },
        cancel: function () { closeModal(null); }
      }, { tall: true });
    modalResolve = resolve;
    $('#storeQ').addEventListener('input', function (e) { $('#storeList').innerHTML = listHtml(e.target.value); });
  });
}

/* =========================================================
 * バーコードの読み取り
 * ========================================================= */
var scriptPromises = {};
function loadScript(url) {
  if (!scriptPromises[url]) {
    scriptPromises[url] = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      var timer = setTimeout(function () { reject(new Error('読み込みがタイムアウトしました')); }, 25000);
      s.src = url;
      s.async = true;
      s.crossOrigin = 'anonymous';
      s.onload = function () { clearTimeout(timer); resolve(); };
      s.onerror = function () { clearTimeout(timer); delete scriptPromises[url]; reject(new Error('読み取り機能を読み込めませんでした')); };
      document.head.appendChild(s);
    });
  }
  return scriptPromises[url];
}

async function loadBitmap(file) {
  if (window.createImageBitmap) {
    try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { /* 下へ */ }
    try { return await createImageBitmap(file); } catch (e) { /* 下へ */ }
  }
  return await new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var im = new Image();
    im.onload = function () { resolve(im); setTimeout(function () { URL.revokeObjectURL(url); }, 1000); };
    im.onerror = function () { URL.revokeObjectURL(url); reject(new Error('写真を開けませんでした')); };
    im.src = url;
  });
}
function drawScaled(img, max) {
  var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  var sc = Math.min(1, max / Math.max(w, h));
  var c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * sc));
  c.height = Math.max(1, Math.round(h * sc));
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c;
}
async function resizeImage(file, max, quality) {
  var img = await loadBitmap(file);
  return drawScaled(img, max).toDataURL('image/jpeg', quality);
}

var Decoder = {
  engine: '', native: null, poly: null, loading: null, frameCanvas: null,
  formats: function () { return (st.boot && st.boot.settings.formats) || ['code_128']; },
  ready: function () {
    if (!this.loading) {
      var self = this;
      this.loading = this.init().catch(function (e) { self.loading = null; throw e; });
    }
    return this.loading;
  },
  init: async function () {
    var want = this.formats();
    if (!CONFIG.FORCE_POLYFILL && 'BarcodeDetector' in window) {
      try {
        var sup = await window.BarcodeDetector.getSupportedFormats();
        var f = want.filter(function (x) { return sup.indexOf(x) >= 0; });
        if (f.indexOf('code_128') >= 0) { this.native = new window.BarcodeDetector({ formats: f }); this.engine = '端末内蔵'; }
      } catch (e) { this.native = null; }
    }
    try {
      await loadScript(CONFIG.SCANNER_LIB_URL);
      var A = window.BarcodeDetectionAPI;
      if (CONFIG.WASM_URL) {
        A.prepareZXingModule({ overrides: { locateFile: function (p, prefix) { return /\.wasm$/.test(p) ? CONFIG.WASM_URL : prefix + p; } } });
      }
      var sup2 = await A.BarcodeDetector.getSupportedFormats();
      var poly = new A.BarcodeDetector({ formats: want.filter(function (x) { return sup2.indexOf(x) >= 0; }) });
      var tiny = document.createElement('canvas');
      tiny.width = tiny.height = 8;
      await poly.detect(tiny);
      this.poly = poly;
      if (!this.engine) this.engine = 'ZXing(wasm)';
    } catch (e) {
      this.poly = null;
    }
    if (!this.native && !this.poly) {
      await loadScript(CONFIG.ZXING_JS_URL);
      this.engine = 'ZXing(js)';
    }
    return true;
  },
  detectJs: function (canvas) {
    var Z = window.ZXing;
    if (!Z) return [];
    var map = { code_128: 'CODE_128', code_39: 'CODE_39', code_93: 'CODE_93', ean_13: 'EAN_13', ean_8: 'EAN_8', qr_code: 'QR_CODE', itf: 'ITF', codabar: 'CODABAR', data_matrix: 'DATA_MATRIX' };
    var formats = this.formats().map(function (f) { return Z.BarcodeFormat[map[f]]; }).filter(function (x) { return x != null; });
    var hints = new Map();
    hints.set(Z.DecodeHintType.TRY_HARDER, true);
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, formats);
    var reader = new Z.MultiFormatReader();
    var sources = [canvas, rotate90(canvas)];
    for (var i = 0; i < sources.length; i++) {
      try {
        var bmp = new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(sources[i])));
        var r = reader.decode(bmp, hints);
        var fmt = Object.keys(map).filter(function (k) { return Z.BarcodeFormat[map[k]] === r.getBarcodeFormat(); })[0] || 'unknown';
        return [{ rawValue: r.getText(), format: fmt }];
      } catch (e) { /* 見つからない */ }
    }
    return [];
  },
  detect: async function (source) {
    var out = [];
    if (this.native) { try { out = await this.native.detect(source); } catch (e) { out = []; } }
    if (!out.length && this.poly) { try { out = await this.poly.detect(source); } catch (e) { out = []; } }
    if (!out.length && !this.native && !this.poly && source.getContext) out = this.detectJs(source);
    return out;
  },
  fromFile: async function (file) {
    await this.ready();
    var img = await loadBitmap(file);
    var longSide = Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height);
    var tried = {};
    var sizes = [1600, 2600];
    for (var i = 0; i < sizes.length; i++) {
      var size = Math.min(sizes[i], longSide);
      if (tried[size]) continue;
      tried[size] = 1;
      var found = await this.detect(drawScaled(img, size));
      if (found.length) return found;
    }
    if (!window.ZXing) { try { await loadScript(CONFIG.ZXING_JS_URL); } catch (e) { return []; } }
    return this.detectJs(drawScaled(img, 1600));
  },
  frame: function (video) {
    if (this.native) return video;
    var vw = video.videoWidth, vh = video.videoHeight;
    var sc = Math.min(1, 1024 / Math.max(vw, vh));
    var c = this.frameCanvas || (this.frameCanvas = document.createElement('canvas'));
    c.width = Math.round(vw * sc);
    c.height = Math.round(vh * sc);
    c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
    return c;
  }
};
function rotate90(canvas) {
  var c = document.createElement('canvas');
  c.width = canvas.height;
  c.height = canvas.width;
  var g = c.getContext('2d');
  g.translate(c.width, 0);
  g.rotate(Math.PI / 2);
  g.drawImage(canvas, 0, 0);
  return c;
}

/* 音と振動 */
var audioCtx = null;
function unlockAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) { audioCtx = null; }
}
document.addEventListener('pointerdown', unlockAudio, { passive: true });
function feedback(type) {
  try {
    if (audioCtx) {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = type === 'ok' ? 1175 : (type === 'dup' ? 330 : 587);
      g.gain.value = 0.07;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + (type === 'ok' ? 0.09 : 0.22));
    }
  } catch (e) { /* 何もしない */ }
  try { if (navigator.vibrate) navigator.vibrate(type === 'ok' ? 60 : [90, 60, 90]); } catch (e) { /* 何もしない */ }
}

function liveAllowed() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.isSecureContext) return false;
  var pp = document.permissionsPolicy || document.featurePolicy;
  if (pp && typeof pp.allowsFeature === 'function') { try { return pp.allowsFeature('camera'); } catch (e) { /* 下へ */ } }
  return MODE !== 'gas';
}
function scanMode() {
  if (st.scanMode === 'photo') return 'photo';
  if (st.liveFailed) return 'photo';
  return liveAllowed() ? 'live' : 'photo';
}
function scanButtonHtml(label, sub) {
  var inner = I.camera + '<span>' + esc(label) + '</span>' + (sub ? '<small>' + esc(sub) + '</small>' : '');
  if (scanMode() === 'live') return '<button class="btn primary hero scan" type="button" data-act="scan">' + inner + '</button>';
  return '<label class="btn primary hero scan" for="camInput" role="button" tabindex="0">' + inner + '</label>';
}
function startScan() {
  if (scanMode() === 'live') Live.open(topName() === 'inv' ? 'inv' : 'single');
  else $('#camInput').click();
}

async function onPhotoForScan(file) {
  var purpose = topName() === 'inv' ? 'inv' : 'single';
  showBusy('バーコードを探しています…');
  var codes = [];
  try {
    codes = await Decoder.fromFile(file);
  } catch (e) {
    hideBusy();
    scanFailed(e.message);
    return;
  }
  hideBusy();
  handleCodes(codes, purpose);
}

function handleCodes(codes, purpose) {
  var values = uniq(codes.map(function (c) { return normSerial(c.rawValue); }).filter(Boolean));
  if (!values.length) { scanFailed(); return; }
  if (purpose === 'inv') {
    values.forEach(function (v) { invAdd(v); });
    if (values.length > 1) toast(values.length + '台を読み取りました');
    return;
  }
  if (values.length === 1) { feedback('ok'); openSerial(values[0]); return; }
  var known = values.filter(function (v) { return st.devices.has(v); });
  if (known.length === 1) { feedback('ok'); openSerial(known[0]); return; }
  openModal('<h3>複数のバーコードが写っています</h3><p class="body">開く番号を選んでください。</p><div class="stack">' +
    values.map(function (v) {
      var d = st.devices.get(v);
      return '<button class="btn left" data-act="choose" data-serial="' + esc(v) + '"><span class="grow"><span class="mono">' + esc(v) + '</span><br><small>' +
        (d ? esc(d.l) : '台帳にありません') + '</small></span>' + (d ? badge(d.st) : '') + '</button>';
    }).join('') + '<button class="btn ghost" data-act="close">やめる</button></div>',
    { choose: function (el) { closeModal(); openSerial(el.getAttribute('data-serial')); }, close: function () { closeModal(); } });
}

function scanFailed(reason) {
  feedback('bad');
  openModal('<h3>バーコードが読み取れませんでした</h3>' +
    (reason ? '<p class="note warn">' + esc(reason) + '</p>' : '') +
    '<p class="body">・黄色いシール全体が写るように、近づいて撮影してください\n・ピントが合ってから撮影してください（ぶれに注意）\n・明るい場所で、光の反射が入らない角度で\n・縦向き・横向きはどちらでも読み取れます</p>' +
    '<div class="stack"><label class="btn primary" for="camInput">' + I.camera + 'もう一度撮影する</label>' +
    '<button class="btn" data-act="manual">' + I.keyboard + '番号を入力する</button>' +
    '<button class="btn ghost" data-act="close">閉じる</button></div>',
    {
      manual: function () { closeModal(); manualInput(); },
      close: function () { closeModal(); }
    });
}

function manualInput() {
  if (topName() === 'inv') { invManual(); return; }
  go('search');
}

function openSerial(raw) {
  var serial = normSerial(raw);
  if (!serial) return;
  if (!SERIAL_RE.test(serial)) {
    alertModal('シリアル番号ではないようです', '読み取った内容：' + serial.slice(0, 80) + '\n\n黄色いシールのバーコードを読み取ってください。');
    return;
  }
  if (topName() === 'device' && topParams().serial === serial) { render(); return; }
  go('device', { serial: serial });
}

/* かざして読み取る（ライブ） */
var Live = {
  stream: null, running: false, purpose: 'single', pending: '', cool: {}, count: 0, torchOn: false,
  open: async function (purpose) {
    this.purpose = purpose;
    this.pending = '';
    this.cool = {};
    this.count = 0;
    $('#scanTitle').textContent = purpose === 'inv' ? '棚卸：' + (st.inv ? st.inv.location : '') : 'バーコードを読み取る';
    $('#scanHint').textContent = purpose === 'inv' ? '1台ずつ、黄色いシールを枠に入れてください（縦でも横でもOK）' : '黄色いシールを枠に入れてください（縦でも横でもOK）';
    $('#scanDone').hidden = purpose !== 'inv';
    $('#scanLast').hidden = true;
    $('#scanTorch').hidden = true;
    $('#scanner').hidden = false;
    histPush('scan');
    try {
      await Decoder.ready();
      this.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
      if ($('#scanner').hidden) { this.stop(); return; }
      var v = $('#video');
      v.srcObject = this.stream;
      await v.play();
      var track = this.stream.getVideoTracks()[0];
      var caps = track && track.getCapabilities ? track.getCapabilities() : {};
      $('#scanTorch').hidden = !caps.torch;
      this.running = true;
      this.loop();
    } catch (e) {
      this.close();
      st.liveFailed = true;
      var denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
      openModal('<h3>カメラを使えませんでした</h3><p class="body">' +
        (denied ? 'カメラの使用が許可されていません。\n「撮影して読み取る」なら、そのまま使えます。' : esc(e && e.message ? e.message : 'カメラを起動できませんでした。')) +
        '</p><div class="stack"><label class="btn primary" for="camInput">' + I.camera + '撮影して読み取る</label>' +
        '<button class="btn" data-act="manual">' + I.keyboard + '番号を入力する</button>' +
        '<button class="btn ghost" data-act="close">閉じる</button></div>',
        { manual: function () { closeModal(); manualInput(); }, close: function () { closeModal(); if (topName() === 'home') render(); } });
    }
  },
  loop: async function () {
    var v = $('#video');
    while (this.running) {
      var t0 = performance.now();
      try {
        if (v.readyState >= 2 && v.videoWidth) {
          var codes = await Decoder.detect(Decoder.frame(v));
          if (codes.length && this.running) this.onCodes(codes);
        }
      } catch (e) { /* 次のフレームへ */ }
      await sleep(Math.max(40, 150 - (performance.now() - t0)));
    }
  },
  onCodes: function (codes) {
    var now = Date.now();
    for (var i = 0; i < codes.length; i++) {
      var v = normSerial(codes[i].rawValue);
      if (!v) continue;
      if (STRONG_FORMATS.indexOf(codes[i].format) < 0 && this.pending !== v) { this.pending = v; continue; }
      if (this.purpose === 'single') {
        this.close();
        feedback('ok');
        openSerial(v);
        return;
      }
      if (now - (this.cool[v] || 0) < 2500) continue;
      this.cool[v] = now;
      var lastBox = $('#scanLast');
      if (st.inv && st.inv.items.some(function (it) { return it.s === v; })) {
        lastBox.hidden = false;
        lastBox.className = 'scan-last';
        lastBox.textContent = v + '：読み取り済み';
        continue;
      }
      var res = invAdd(v, true);
      var frame = $('#scanFrame');
      frame.classList.add('hit');
      setTimeout(function () { frame.classList.remove('hit'); }, 350);
      var last = $('#scanLast');
      last.hidden = false;
      last.className = 'scan-last ' + (res.kind === 'ok' ? 'ok' : 'warn');
      last.textContent = (res.kind === 'ok' ? '✓ ' : '') + res.text + '（合計' + (st.inv ? st.inv.items.length : 0) + '台）';
    }
  },
  toggleTorch: async function () {
    try {
      var track = this.stream.getVideoTracks()[0];
      this.torchOn = !this.torchOn;
      await track.applyConstraints({ advanced: [{ torch: this.torchOn }] });
    } catch (e) { toast('ライトを切り替えられませんでした'); }
  },
  stop: function () {
    this.running = false;
    if (this.stream) { this.stream.getTracks().forEach(function (t) { t.stop(); }); this.stream = null; }
    var v = $('#video');
    try { v.pause(); v.srcObject = null; } catch (e) { /* 何もしない */ }
  },
  close: function () {
    this.stop();
    $('#scanner').hidden = true;
    if (topName() === 'inv') render();
  }
};
$('#scanClose').addEventListener('click', function () { Live.close(); });
$('#scanDone').addEventListener('click', function () { Live.close(); });
$('#scanTorch').addEventListener('click', function () { Live.toggleTorch(); });
$('#scanManual').addEventListener('click', function () { Live.close(); manualInput(); });

function onFile(id, fn) {
  $(id).addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (!$('#scanner').hidden) Live.close();
    closeModal();
    fn(file);
  });
}

onFile('#pickInput', onPhotoForScan);
function onAttach(file) {
  var F = st.form;
  if (!F || F.photos.length >= 3) return;
  showBusy('写真を準備しています…');
  resizeImage(file, 1280, 0.8).then(function (data) {
    hideBusy();
    F.photos.push(data);
    if (topName() === 'form') paintForm();
  }, function (e) { hideBusy(); alertModal('写真を追加できませんでした', e.message); });
}

onFile('#photoPick', onAttach);

});

/* バーコードリーダー（キーボード入力型）：ホーム・棚卸画面で入力を受け付ける */
var wedge = { buf: '', last: 0 };
document.addEventListener('keydown', function (e) {
  var tag = (e.target && e.target.tagName) || '';
  if (/INPUT|TEXTAREA|SELECT/.test(tag) || !$('#modal').hidden) return;
  if (['home', 'inv', 'device'].indexOf(topName()) < 0) return;
  var now = Date.now();
  if (now - wedge.last > 80) wedge.buf = '';
  wedge.last = now;
  if (e.key === 'Enter') {
    if (wedge.buf.length >= 4) {
      var v = wedge.buf;
      wedge.buf = '';
      if (topName() === 'inv') invAdd(v); else openSerial(v);
    }
    return;
  }
  if (e.key.length === 1) wedge.buf += e.key;
});

    html += '<button class="stat' + (n ? '' : ' zero') + '" data-act="listStatus" data-status="' + esc(s.name) + '" style="--c:' + esc(s.color) + '"><i></i><span>' + esc(s.name) + '</span><b>' + n + '</b></button>';

function canUndo(o) { return o.undoable && !o.undone && st.boot && (Date.now() - o.at) < st.boot.settings.undoMinutes * 60000; }
function addOp(o) {
  st.ops = [o].concat(st.ops.filter(function (x) { return x.opId !== o.opId; })).slice(0, 12);
  store.set('ops', st.ops);
}
function recentOpsHtml() {
  var ops = st.ops.slice(0, 5);
  if (!ops.length) return '';
  return '<h2 class="sec">この端末での最近の記録</h2><div class="card list">' + ops.map(function (o) {

      (o.serial ? '<button class="li-main" data-act="openSerial" data-serial="' + esc(o.serial) + '">' + main + '</button>' : '<div class="li-main">' + main + '</div>') +
      (canUndo(o) ? '<button class="btn small" data-act="undo" data-op="' + esc(o.opId) + '">' + I.undo + '元に戻す</button>' : '') +

}

/* =========================================================
 * 画面：番号で探す
 * ========================================================= */
screens.search = function () {
  setView('<form class="card" id="searchForm" autocomplete="off">' +
    '<label class="field"><span>シリアル番号（黄色シールの文字）</span>' +
    '<input id="inSerial" class="big" type="text" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="search" placeholder="PAC07A0100832"></label>' +
    '<button class="btn primary" type="submit">' + I.search + 'この番号を開く</button>' +
    '<p class="hint" style="margin:10px 0 0">下4桁（例：0832）だけでも探せます。バーコードリーダー（USB・Bluetooth）でも入力できます。</p>' +
    '</form><div id="suggest"></div>', '番号で探す');
  var inp = $('#inSerial');
  setTimeout(function () { inp.focus(); }, 80);
  inp.addEventListener('input', function () { renderSuggest(inp.value); });
  $('#searchForm').addEventListener('submit', function (e) { e.preventDefault(); submitSearch(inp.value); });
};
function matchSerials(q, limit) {
  var n = normSerial(q);
  if (!n) return [];
  var out = [];
  st.devices.forEach(function (d) { if (d.s.indexOf(n) >= 0) out.push(d); });
  out.sort(function (a, b) {
    var ea = a.s.slice(-n.length) === n ? 0 : 1, eb = b.s.slice(-n.length) === n ? 0 : 1;
    return ea - eb || (a.s < b.s ? -1 : 1);
  });
  return out.slice(0, limit);
}
function submitSearch(q) {
  var n = normSerial(q);
  if (!n) { toast('番号を入力してください'); return; }
  if (st.devices.has(n)) { openSerial(n); return; }
  var m = matchSerials(n, 50);
  if (m.length === 1) { openSerial(m[0].s); return; }
  if (m.length > 1) { toast(m.length + '台が当てはまります。下から選んでください'); renderSuggest(q); return; }
  openSerial(n);
}
function renderSuggest(q) {
  var box = $('#suggest');
  if (!box) return;
  if (!normSerial(q)) { box.innerHTML = ''; return; }
  var m = matchSerials(q, 30);
  box.innerHTML = m.length ? '<div class="card list" style="padding:0">' + m.map(deviceRowHtml).join('') + '</div>' :
    '<p class="empty">台帳に一致する端末はありません。<br>「この番号を開く」から新しく登録できます。</p>';
}
function deviceRowHtml(d) {
  var stale = isStale(d);
  return '<button class="li" data-act="openSerial" data-serial="' + esc(d.s) + '">' +
    '<span class="li-top"><span class="mono">' + esc(d.s) + '</span>' + badge(d.st) + '</span>' +
    '<span class="li-sub">' + esc(d.l || '（場所なし）') + (d.p ? '・' + esc(d.p) : '') + (d.m ? '・' + esc(d.m) : '') + '</span>' +
    '<span class="li-sub' + (stale ? ' warn-text' : '') + '">' + (d.ck ? '確認：' + esc(ago(d.ck)) + (d.cb ? '（' + esc(d.cb) + '）' : '') : 'まだ読み取り確認されていません') + '</span>' +
    '</button>';
}

/* =========================================================
 * 画面：一覧
 * ========================================================= */
screens.list = function (p) {
  var f = st.listFilter = st.listFilter || { q: '', status: p.status || '', loc: '', stale: !!p.stale, limit: 80 };
  var counts = {};
  var locs = {};
  st.devices.forEach(function (d) { counts[d.st] = (counts[d.st] || 0) + 1; locs[d.l] = 1; });
  var order = storeNames();
  var locList = Object.keys(locs).sort(function (a, b) {
    var ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia < 0 ? 9999 : ia) - (ib < 0 ? 9999 : ib) || (a < b ? -1 : 1);
  });
  var chips = '<button class="chip" data-act="fStatus" data-v="" aria-pressed="' + (!f.status && !f.stale) + '">すべて</button>' +
    st.boot.statuses.map(function (s) {
      return '<button class="chip status" style="--c:' + esc(s.color) + '" data-act="fStatus" data-v="' + esc(s.name) + '" aria-pressed="' + (f.status === s.name) + '"><i class="dot"></i>' + esc(s.name) + ' ' + (counts[s.name] || 0) + '</button>';
    }).join('') +
    '<button class="chip" data-act="fStale" aria-pressed="' + f.stale + '">未確認・長期未確認</button>';
  setView('<div class="search-row"><input type="search" id="listQ" placeholder="番号・店舗名で絞り込み" value="' + esc(f.q) + '" autocomplete="off"></div>' +
    '<div class="filters" style="margin-top:10px">' + chips + '</div>' +
    '<select id="listLoc" aria-label="設置場所で絞り込み"><option value="">すべての場所</option>' +
    locList.map(function (l) { return '<option value="' + esc(l) + '"' + (f.loc === l ? ' selected' : '') + '>' + esc(l || '（場所なし）') + '</option>'; }).join('') + '</select>' +
    '<div id="listBody"></div>', '一覧');
  acts.fStatus = function (el) { f.status = el.getAttribute('data-v'); f.stale = false; f.limit = 80; render(); };
  acts.fStale = function () { f.stale = !f.stale; f.status = ''; f.limit = 80; render(); };
  acts.more = function () { f.limit += 200; paintList(); };
  $('#listQ').addEventListener('input', function (e) { f.q = e.target.value; f.limit = 80; paintList(); });
  $('#listLoc').addEventListener('change', function (e) { f.loc = e.target.value; f.limit = 80; paintList(); });
  paintList();
};
function paintList() {
  var f = st.listFilter;
  var qs = normSerial(f.q), qk = normKey(f.q);
  var rows = [];
  st.devices.forEach(function (d) {
    if (f.status && d.st !== f.status) return;
    if (f.stale && !isStale(d)) return;
    if (f.loc && d.l !== f.loc) return;
    if (qk && d.s.indexOf(qs) < 0 && normKey(d.l).indexOf(qk) < 0) return;
    rows.push(d);
  });
  var order = storeNames();
  rows.sort(function (a, b) {
    var ia = order.indexOf(a.l), ib = order.indexOf(b.l);
    return (ia < 0 ? 9999 : ia) - (ib < 0 ? 9999 : ib) || (a.l < b.l ? -1 : a.l > b.l ? 1 : 0) || (a.s < b.s ? -1 : 1);
  });
  var shown = rows.slice(0, f.limit);
  $('#listBody').innerHTML = '<h2 class="sec">' + rows.length + '台</h2>' +
    (shown.length ? '<div class="card list" style="padding:0">' + shown.map(deviceRowHtml).join('') + '</div>' : '<p class="empty">当てはまる端末はありません</p>') +
    (rows.length > shown.length ? '<button class="btn" data-act="more">さらに表示（残り' + (rows.length - shown.length) + '台）</button>' : '');
}

/* =========================================================
 * 画面：端末
 * ========================================================= */
screens.device = function (p) {
  var serial = p.serial;
  var cached = st.devices.get(serial);
  st.cur = { serial: serial, device: cached ? fromCompact(cached) : null, history: null, loading: true, error: null };
  paintDevice();
  api('getDevice', { serial: serial }).then(function (r) {
    if (topName() !== 'device' || topParams().serial !== serial) return;
    st.cur = { serial: serial, device: r.device, history: r.history, loading: false, error: null };
    if (r.device) cacheDevice(r.device); else st.devices.delete(serial);
    paintDevice();
  }, function (e) {
    if (topName() !== 'device' || topParams().serial !== serial) return;
    if (e.code === 'AUTH') { handleError(e); return; }
    st.cur.loading = false;
    st.cur.error = e;
    paintDevice();
  });
};

function paintDevice() {
  var c = st.cur;
  var d = c.device;
  acts.report = function () { go('form', { serial: c.serial, type: 'report' }); };
  acts.move = function () { go('form', { serial: c.serial, type: 'move' }); };
  acts.change = function () { go('form', { serial: c.serial, type: 'status' }); };
  acts.register = function () { go('form', { serial: c.serial, type: 'new' }); };
  acts.check = function () { quickSave('check'); };
  acts.revive = function () { quickSave('revive'); };
  acts.reload = function () { render(); };
  var html = '';
  if (c.error && c.error.code === 'DUPLICATE_ROWS') {
    setView('<div class="card"><div class="serial">' + esc(c.serial) + '</div></div><div class="note danger">' + I.alert + '<div><b>この端末は台帳に複数行あります</b><br>' + esc(c.error.message) + '</div></div>' +
      '<p class="hint">重複を整理するまで、この端末の記録はできません。本部に連絡してください。</p>', '端末');
    return;
  }
  if (!d && c.loading) {
    setView('<div class="card"><div class="serial">' + esc(c.serial) + '</div><div class="loading"><span class="spinner sm"></span>台帳を確認しています…</div></div>', '端末');
    return;
  }
  if (!d && c.error) {
    setView('<div class="card"><div class="serial">' + esc(c.serial) + '</div></div><div class="note warn">' + I.alert + '<div>' + esc(c.error.message) + '</div></div>' +
      '<button class="btn primary" data-act="reload">' + I.refresh + 'もう一度読み込む</button>', '端末');
    return;
  }
  if (!d) {
    var okFmt = patternOk(c.serial);
    html += '<div class="card"><div class="serial">' + esc(c.serial) + '</div>' +
      '<div class="note info" style="margin:0">' + I.question + '<div><b>台帳にない端末です</b><br>新しく登録すると、次から状態や場所を記録できます。</div></div></div>';
    if (!okFmt) {
      html += '<div class="note warn">' + I.alert + '<div><b>いつもの番号の形と違います</b><br>読み取りミスや、別のバーコード（箱・背面など）の可能性があります。黄色いシールの番号と見比べてください。</div></div>';
    }
    html += '<div class="stack"><button class="btn primary" data-act="register">' + I.plus + 'この端末を登録する</button>' +
      scanButtonHtml('別のバーコードを読み取る').replace(' hero', '') + '</div>';
    setView(html, '未登録の端末');
    return;
  }
  var info = statusInfo(d.status);
  var kind = info.kind;
  var normal = normalStatus();
  html += '<div class="card">' +
    '<div class="serial">' + esc(d.serial) + '</div>' +
    pill(d.status) +
    '<div class="place">' + I.pin + '<span>' + esc(d.location || '（場所なし）') + (d.spot ? '<br><small style="font-weight:600;color:var(--muted)">' + esc(d.spot) + '</small>' : '') + '</span></div>' +
    '<dl class="kv">' +
    (d.symptom ? '<dt>症状</dt><dd>' + esc(d.symptom) + '</dd>' : '') +
    (d.model ? '<dt>機種</dt><dd>' + esc(d.model) + '</dd>' : '') +
    (d.contract && d.contract !== '契約中' ? '<dt>契約</dt><dd><b class="warn-text">' + esc(d.contract) + '</b></dd>' : '') +
    (d.memo && d.memo !== d.symptom ? '<dt>メモ</dt><dd>' + esc(d.memo) + '</dd>' : '') +
    '<dt>最終確認</dt><dd>' + (d.checkedAt ? esc(fmtDate(d.checkedAt)) + '（' + esc(d.checkedBy || '') + '）' : '<span class="warn-text">まだ読み取り確認されていません</span>') + '</dd>' +
    (d.updatedAt ? '<dt>最終更新</dt><dd>' + esc(fmtDate(d.updatedAt)) + '（' + esc(d.updatedBy || '') + '）</dd>' : '') +
    (d.photos && d.photos.length ? '<dt>写真</dt><dd>' + d.photos.map(function (u, i) { return '<a href="' + esc(u) + '" target="_blank" rel="noopener">写真' + (i + 1) + '</a>'; }).join('　') + '</dd>' : '') +
    '</dl>' +
    (c.loading ? '<div class="loading"><span class="spinner sm"></span>最新の情報を確認中…</div>' : '') +
    '</div>';

  var reviveLabel = { '故障': '直った（' + normal + 'に戻す）', '修理': '修理から戻った（' + normal + 'にする）', '移動': 'ここに届いた（' + normal + 'にする）', '不明': '見つかった（' + normal + 'に戻す）', '保管': '使い始める（' + normal + 'にする）' }[kind];
  var banner = {
    '故障': ['danger', '故障・不具合として報告されています'],
    '修理': ['warn', '修理・交換に出している端末です'],
    '移動': ['info', '移動中の端末です（行き先：' + (d.location || '未設定') + '）'],
    '不明': ['warn', '所在不明になっている端末です'],
    '終了': ['warn', '解約・返却済みの端末です。店舗にある場合は本部に連絡してください。']
  }[kind];
  if (banner) html += '<div class="note ' + banner[0] + '">' + I.alert + '<div><b>' + esc(banner[1]) + '</b></div></div>';
  if (isStale({ st: d.status, ck: d.checkedAt }) && kind !== '終了' && d.checkedAt) {
    html += '<div class="note warn">' + I.alert + '<div>' + st.boot.settings.staleDays + '日以上、読み取り確認されていません。</div></div>';
  }

  html += '<div class="stack">';
  if (reviveLabel && d.status !== normal) html += '<button class="btn okb" data-act="revive">' + I.check + esc(reviveLabel) + '</button>';
  if (kind === '正常' || kind === '') html += '<button class="btn okb" data-act="check">' + I.check + '異常なし（確認を記録）</button>';
  if (kind !== '故障') html += '<button class="btn danger" data-act="report">' + I.alert + '故障・不具合を報告</button>';
  else html += '<button class="btn" data-act="report">' + I.alert + '症状を追記する</button>';
  html += '<button class="btn" data-act="move">' + I.move + '別の場所へ移動</button>';
  html += '<button class="btn" data-act="change">' + I.edit + '状態・メモを変更</button>';
  if (kind !== '正常' && kind !== '') html += '<button class="btn ghost" data-act="check">' + I.check + '確認だけ記録する</button>';
  html += '</div>';

  html += '<h2 class="sec">履歴</h2>';
  if (!c.history) html += c.loading ? '<div class="loading"><span class="spinner sm"></span>読み込み中…</div>' : '';
  else if (!c.history.length) html += '<p class="empty">まだ履歴はありません</p>';
  else {
    html += '<ul class="card hist">' + c.history.map(function (h) {
      var change = [];
      if (h.st0 && h.st1 && h.st0 !== h.st1) change.push(h.st0 + ' → ' + h.st1);
      if (h.l0 && h.l1 && h.l0 !== h.l1) change.push(h.l0 + ' → ' + h.l1);
      return '<li class="' + (h.undone ? 'undone' : '') + '"><div class="h-top"><span>' + esc(h.op) + '</span><span class="h-sub">' + esc(fmtDate(h.t)) + '</span></div>' +
        '<div class="h-sub">' + esc(h.u) + (change.length ? '・' + esc(change.join('／')) : '') + '</div>' +
        (h.sy && h.op.indexOf('故障') >= 0 ? '<div class="h-sub">症状：' + esc(h.sy) + '</div>' : '') +
        (h.c ? '<div class="h-sub">' + esc(h.c) + '</div>' : '') +
        (h.ph && h.ph.length ? '<div class="h-sub">' + h.ph.map(function (u, i) { return '<a href="' + esc(u) + '" target="_blank" rel="noopener">写真' + (i + 1) + '</a>'; }).join('　') + '</div>' : '') +
        (h.undone ? '<div class="h-sub">' + esc(h.undone) + '</div>' : '') + '</li>';
    }).join('') + '</ul>';
  }
  setView(html, '端末');
}

async function quickSave(type) {
  var d = st.cur && st.cur.device;
  if (!d) return;
  var payload = { serial: d.serial, clientOpId: newId() };
  if (type === 'check') payload.mode = 'check';
  else { payload.mode = 'update'; payload.baseRev = d.rev; payload.status = normalStatus(); payload.kind = 'revive'; }
  await submitSave(payload, null);
}

/* =========================================================
 * 画面：入力フォーム（故障報告・移動・状態変更・新規登録）
 * ========================================================= */
screens.form = function (p) {
  var d = st.cur && st.cur.serial === p.serial ? st.cur.device : null;
  if (p.type !== 'new' && !d) { back(); return; }
  if (!st.form || st.form.serial !== p.serial || st.form.type !== p.type || st.form.key !== p.key) st.form = initForm(p, d);
  paintForm();
};

function initForm(p, d) {
  var normal = normalStatus();
  var f = {
    key: p.key, type: p.type, serial: p.serial, opId: newId(), baseRev: d ? d.rev : 0,
    status: d ? d.status : normal, location: d ? d.location : (st.recentStores[0] || ''), spot: d ? d.spot : '',
    memo: d ? d.memo : '', model: d ? d.model : inferModel(p.serial), symptoms: [], comment: '', photos: [],
    current: d
  };
  if (p.type === 'report') f.status = statusByKind('故障') || f.status;
  if (p.type === 'move') { f.location = ''; f.moveState = (kindOf(d.status) === '正常' || kindOf(d.status) === '') ? 'installed' : 'keep'; }
  if (p.type === 'new') f.status = normal;
  return f;
}

function chipGroup(name, options, selected, multi, statusStyle, cls) {
  return '<div class="chips' + (cls ? ' ' + cls : '') + '">' + options.map(function (o) {
    var v = typeof o === 'string' ? o : o.value;
    var label = typeof o === 'string' ? o : o.label;
    var sub = typeof o === 'string' ? '' : (o.sub || '');
    var on = multi ? selected.indexOf(v) >= 0 : selected === v;
    var style = statusStyle ? ' status" style="--c:' + esc(statusInfo(v).color) : '';
    return '<button type="button" class="chip' + style + '" data-act="' + name + '" data-v="' + esc(v) + '" aria-pressed="' + on + '">' +
      (statusStyle ? '<i class="dot"></i>' : '') + '<span>' + esc(label) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span></button>';
  }).join('') + '</div>';
}

function paintForm() {
  var F = st.form;
  var d = F.current;
  var titles = { report: '故障・不具合の報告', move: '別の場所へ移動', status: '状態・メモの変更', new: '端末の新規登録' };
  var html = '<div class="card" style="padding:12px 16px"><div class="serial" style="font-size:21px;margin:0">' + esc(F.serial) + '</div>' +
    (d ? '<div class="li-sub">' + esc(d.location) + (d.spot ? '・' + esc(d.spot) : '') + '　' + badge(d.status) + '</div>' : '') + '</div>';
  var showSymptoms = F.type === 'report' || ((F.type === 'status' || F.type === 'new') && kindOf(F.status) === '故障');

  if (F.type === 'new') {
    if (!patternOk(F.serial)) html += '<div class="note warn">' + I.alert + '<div>いつもの番号の形と違います。黄色いシールの番号と同じか確認してください。</div></div>';
    html += '<div class="field"><span class="label">設置場所<span class="req">必須</span></span>' + pickerHtml(F.location) + '</div>';
  }
  if (F.type === 'move') {
    html += '<div class="field"><span class="label">移動先<span class="req">必須</span></span>' + pickerHtml(F.location) + '</div>';
    var opts = [];
    var cur = d.status;
    if (F.moveState === 'keep' || !(kindOf(cur) === '正常' || kindOf(cur) === '')) opts.push({ value: 'keep', label: '今の状態のまま（' + cur + '）' });
    opts.push({ value: 'installed', label: 'もう設置した', sub: '→ ' + normalStatus() });
    if (statusByKind('移動')) opts.push({ value: 'transit', label: 'これから運ぶ・発送する', sub: '→ ' + statusByKind('移動') });
    if (statusByKind('保管')) opts.push({ value: 'stored', label: '保管する（使わない）', sub: '→ ' + statusByKind('保管') });

  }

function pickerHtml(value) {

async function submitForm() {
  var F = st.form;
  var d = F.current;
  if ((F.type === 'new' || F.type === 'move') && !F.location) { toast(F.type === 'move' ? '移動先を選んでください' : '設置場所を選んでください'); globalActsPick(); return; }
  if (F.type === 'report' && !F.symptoms.length && !F.comment.trim()) { toast('症状を選ぶか、様子を書いてください'); return; }
  if (F.type === 'move' && d && normKey(F.location) === normKey(d.location) && F.moveState === 'keep' && F.spot === d.spot) { toast('今と同じ場所です'); return; }
  if (F.type === 'new' && !patternOk(F.serial)) {
    var yes = await confirmModal('このまま登録しますか？', F.serial + '\n\nいつもの番号の形と違います。読み取りミスの可能性があります。', '登録する');
    if (!yes) return;
  }
  var base = { serial: F.serial, clientOpId: F.opId, comment: F.comment.trim(), photos: F.photos.slice() };
  var p;
  if (F.type === 'new') {
    p = Object.assign(base, { mode: 'new', location: F.location, spot: F.spot, status: F.status, symptoms: kindOf(F.status) === '故障' ? F.symptoms : [], model: F.model.trim(), deviceMemo: F.memo.trim() });
  } else {
    p = Object.assign(base, { mode: 'update', baseRev: F.baseRev });
    if (F.type === 'report') Object.assign(p, { kind: 'report', status: statusByKind('故障') || d.status, symptoms: F.symptoms });
    if (F.type === 'move') {
      var target = { installed: normalStatus(), transit: statusByKind('移動'), stored: statusByKind('保管'), keep: d.status }[F.moveState] || d.status;
      Object.assign(p, { kind: 'move', location: F.location, status: target, spot: F.spot });
    }
    if (F.type === 'status') Object.assign(p, { kind: 'status', status: F.status, symptoms: kindOf(F.status) === '故障' ? F.symptoms : [], location: F.location, spot: F.spot, deviceMemo: F.memo.trim() });
  }
  await submitSave(p, F);
}
function globalActsPick() { if (acts.pickLoc) acts.pickLoc(); }

async function submitSave(payload, F) {
  var r;
  try { r = await run(function () { return api('saveDevice', payload); }, payload.photos && payload.photos.length ? '写真を送って保存しています…' : '保存しています…'); }
  catch (e) { return; }
  if (r.result === 'saved') {
    cacheDevice(r.device);
    rememberStore(r.device.location);
    addOp({ opId: r.opId, serial: r.device.serial, title: r.device.serial, op: r.op, at: Date.now(), undoable: r.undoable });
    st.form = null;
    var params = { kind: 'save', serial: r.device.serial, op: r.op, opId: r.opId, undoable: r.undoable, device: r.device };
    if (topName() === 'form') go('done', params, { replace: true }); else go('done', params);
    return;
  }
  if (F) F.opId = newId();
  if (r.result === 'conflict') {
    var last = r.last;
    openModal('<h3>ほかの人が先に更新しました</h3><p class="body">' +
      (last ? esc(last.u) + 'さんが「' + esc(last.op) + '」を保存しました（' + esc(ago(last.t)) + '）。\n' : '') +
      'いまの状態：' + esc(r.device.status) + '／' + esc(r.device.location) + '</p><div class="stack">' +
      '<button class="btn primary" data-act="latest">最新の状態を見る</button>' +
      (F ? '<button class="btn" data-act="force">内容を確認して、このまま保存する</button>' : '') +
      '<button class="btn ghost" data-act="close">閉じる</button></div>',
      {
        latest: function () { closeModal(); cacheDevice(r.device); st.form = null; if (topName() === 'form') back(); else render(); },
        force: function () { closeModal(); F.baseRev = r.device.rev; F.current = r.device; st.cur.device = r.device; toast('最新の状態に合わせました。内容を確認して保存してください'); paintForm(); },
        close: function () { closeModal(); if (topName() === 'device') render(); }
      });
    return;
  }
  if (r.result === 'exists') {
    cacheDevice(r.device);
    openModal('<h3>この端末はすでに登録されています</h3><p class="body"><span class="mono">' + esc(r.device.serial) + '</span>\n' + esc(r.device.location) + '／' + esc(r.device.status) +
      '\n\nほかの人が先に登録したようです。</p><button class="btn primary" data-act="open">この端末を開く</button>',
      { open: function () { closeModal(); st.form = null; if (topName() === 'form') back(); else openSerial(r.device.serial); } });
    return;
  }
  if (r.result === 'notfound') {
    st.devices.delete(r.serial);
    openModal('<h3>台帳に見つかりません</h3><p class="body">この端末は台帳から削除された可能性があります。新しく登録しますか？</p><div class="stack">' +
      '<button class="btn primary" data-act="reg">新しく登録する</button><button class="btn ghost" data-act="close">閉じる</button></div>',
      { reg: function () { closeModal(); st.form = null; st.cur = { serial: r.serial, device: null }; go('form', { serial: r.serial, type: 'new' }, { replace: topName() === 'form' }); }, close: function () { closeModal(); } });
  }
}

async function doUndo(opId) {
  var op = st.ops.filter(function (o) { return o.opId === opId; })[0];
  var ok = await confirmModal('元に戻しますか？', (op ? op.title + '\n「' + op.op + '」' : 'この操作') + 'を取り消して、記録する前の状態に戻します。', '元に戻す', true);
  if (!ok) return;
  var r;
  try { r = await run(function () { return api('undo', { opId: opId, clientOpId: newId() }); }, '元に戻しています…'); }
  catch (e) { return; }
  if (op) { op.undone = true; store.set('ops', st.ops); }
  if (!r.okCount) {
    alertModal('元に戻せませんでした', r.items.map(function (x) { return x.serial + '：' + x.reason; }).join('\n'));
    return;
  }
  try { await loadBoot(); } catch (e) { /* 後で更新 */ }
  if (r.ngCount) alertModal('一部だけ元に戻しました', r.items.filter(function (x) { return !x.ok; }).map(function (x) { return x.serial + '：' + x.reason; }).join('\n'));
  else toast('元に戻しました');
  if (topName() === 'done') { if (st.stack.length > 1) back(); else go('home', null, { root: true }); }
  else render();
}
