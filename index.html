function saveInv() { if (st.inv) store.set('inv', st.inv); else store.del('inv'); }
function invTargetKinds(k) { return k === '正常' || k === '故障' || k === '保管' || k === '不明' || k === ''; }
function invExpected() {
  var loc = normKey(st.inv.location);
  var out = [];
  st.devices.forEach(function (d) { if (normKey(d.l) === loc && invTargetKinds(kindOf(d.st))) out.push(d); });
  return out;
}

screens.invPick = function () {
  var names = storeNames();
  var counts = {};
  st.devices.forEach(function (d) { if (invTargetKinds(kindOf(d.st))) counts[d.l] = (counts[d.l] || 0) + 1; });
  var html = '';
  if (st.inv) {
    html += '<div class="card"><div class="label">途中の棚卸があります</div><p style="margin:0 0 12px"><b>' + esc(st.inv.location) + '</b>・' + st.inv.items.length + '台読み取り済み</p>' +
      '<div class="stack"><button class="btn primary" data-act="resumeInv">続きから再開する</button><button class="btn ghost" data-act="discard">破棄して新しく始める</button></div></div>';
  }
  html += '<p class="hint" style="margin:0 4px 12px">棚卸では、その場所にある端末をまとめて読み取り、台帳との違い（見つからない・別の場所で登録されている・未登録）を確認できます。</p>';
  html += '<input type="search" id="invQ" placeholder="店舗名で絞り込み" autocomplete="off" style="margin-bottom:12px"><div class="stack" id="invStores"></div>';
  setView(html, '棚卸：場所を選ぶ');
  var draw = function (q) {
    var k = normKey(q);
    var recent = st.recentStores.filter(function (n) { return names.indexOf(n) >= 0; });
    var list = k ? names.filter(function (n) { return normKey(n).indexOf(k) >= 0; }) : uniq(recent.concat(names));
    $('#invStores').innerHTML = list.map(function (n) {
      return '<button class="btn left" data-act="startInv" data-name="' + esc(n) + '">' + I.pin + '<span class="grow">' + esc(n) + '</span><small style="color:var(--muted)">台帳 ' + (counts[n] || 0) + '台</small></button>';
    }).join('') || '<p class="empty">見つかりません</p>';
  };
  draw('');
  $('#invQ').addEventListener('input', function (e) { draw(e.target.value); });
  acts.discard = async function () {
    if (!(await confirmModal('途中の棚卸を破棄しますか？', '読み取った' + st.inv.items.length + '台の記録は保存されません。', '破棄する', true))) return;
    st.inv = null; saveInv(); render();
  };
  acts.startInv = async function (el) {
    var n = el.getAttribute('data-name');
    if (st.inv && st.inv.items.length && !(await confirmModal('途中の棚卸を破棄しますか？', st.inv.location + 'で読み取った' + st.inv.items.length + '台の記録は保存されません。', '破棄して始める', true))) return;
    st.inv = { location: n, items: [], startedAt: Date.now(), last: null };
    saveInv();
    rememberStore(n);
    go('inv', null, { replace: true });
  };
};

function invAdd(raw, silent) {
  var s = normSerial(raw);
  var res;
  if (!st.inv) return { kind: 'bad', text: '' };
  if (!s || !SERIAL_RE.test(s)) {
    res = { kind: 'bad', s: s, text: 'シリアル番号ではないバーコードです' };
  } else if (st.inv.items.some(function (i) { return i.s === s; })) {
    res = { kind: 'dup', s: s, text: s + '：読み取り済みです' };
  } else {
    var d = st.devices.get(s);
    var kind = !d ? 'new' : (normKey(d.l) !== normKey(st.inv.location) ? 'moved' : 'ok');
    st.inv.items.unshift({ s: s, t: Date.now(), kind: kind });
    res = { kind: kind, s: s, text: kind === 'ok' ? s + '：OK' : kind === 'new' ? s + '：台帳にない端末' : s + '：台帳では「' + d.l + '」' };
  }
  st.inv.last = res;
  saveInv();
  feedback(res.kind === 'ok' ? 'ok' : res.kind === 'dup' ? 'dup' : 'warn');
  if (topName() === 'inv') render();
  else if (!silent && res.kind === 'dup') toast('この端末はもう読み取っています');
  return res;
}

function invManual() {
  openModal('<h3>番号を入力して追加</h3><form id="invManForm" autocomplete="off"><input id="invMan" class="big" type="text" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="PAC07A0100832" data-autofocus>' +
    '<p class="hint">下4桁でも候補を出します</p><div id="invManSug"></div>' +
    '<div class="stack"><button class="btn primary" type="submit">追加する</button><button class="btn ghost" type="button" data-act="close">閉じる</button></div></form>',
    { close: function () { closeModal(); }, pickSug: function (el) { closeModal(); invAdd(el.getAttribute('data-serial')); } });
  var inp = $('#invMan');
  inp.addEventListener('input', function () {
    var m = inp.value.trim().length >= 3 ? matchSerials(inp.value, 6) : [];
    $('#invManSug').innerHTML = m.length ? '<div class="stack" style="margin-bottom:12px">' + m.map(function (d) {
      return '<button type="button" class="btn left small" style="width:100%" data-act="pickSug" data-serial="' + esc(d.s) + '"><span class="mono grow">' + esc(d.s) + '</span><small>' + esc(d.l) + '</small></button>';
    }).join('') + '</div>' : '';
  });
  $('#invManForm').addEventListener('submit', function (e) {

  });
}

screens.inv = function () {
  if (!st.inv) { go('invPick', null, { replace: true }); return; }
  var inv = st.inv;
  var expected = invExpected();
  var scanned = {};
  inv.items.forEach(function (i) { scanned[i.s] = i; });
  var foundExpected = expected.filter(function (d) { return scanned[d.s]; }).length;
  var notYet = expected.filter(function (d) { return !scanned[d.s]; });
  var pct = expected.length ? Math.round(foundExpected / expected.length * 100) : 0;
  var live = scanMode() === 'live';
  var html = '<div class="card"><div class="label">棚卸中の場所</div><div style="font-size:19px;font-weight:800">' + esc(inv.location) + '</div>' +
    '<div class="progress" aria-hidden="true"><i style="width:' + pct + '%"></i></div>' +
    '<div class="li-sub">台帳の ' + expected.length + '台中 <b style="color:var(--ink)">' + foundExpected + '台</b> を確認・読み取り合計 ' + inv.items.length + '台</div></div>';
  if (inv.last) {
    var icon = inv.last.kind === 'ok' ? I.check : I.alert;
    html += '<div class="flash ' + esc(inv.last.kind) + '" aria-live="polite">' + icon + '<span>' + esc(inv.last.text) + '</span></div>';
  }
  html += live ? '<button class="btn primary hero scan" data-act="scan">' + I.camera + '<span>続けて読み取る</span><small>かざすだけで次々に読み取ります</small></button>' :
    scanButtonHtml('撮影して追加', '1枚に何台写っていてもOK');
  html += '<div class="row2" style="margin-top:10px"><button class="btn" data-act="man">' + I.keyboard + '番号で追加</button>' +
    '<label class="btn" for="pickInput">' + I.image + '写真から</label></div>';
  html += '<button class="btn okb" data-act="finish"' + (inv.items.length || expected.length ? '' : ' disabled') + '>' + I.check + '棚卸を終えて確認する</button>';

  if (inv.items.length) {
    html += '<h2 class="sec">読み取った端末<small>' + inv.items.length + '台</small></h2><div class="card list" style="padding:0">' +
      inv.items.map(function (it, idx) {
        var d = st.devices.get(it.s);
        var k = it.kind;
        var sub = k === 'ok' ? '台帳どおり' : k === 'new' ? '台帳にない端末' : '台帳では「' + (d ? d.l : '') + '」';
        return '<div class="li"><span class="kind ' + k + '">' + (k === 'ok' ? I.check : k === 'new' ? I.plus : I.move) + '</span>' +
          '<div class="li-main"><span class="li-top"><span class="mono">' + esc(it.s) + '</span>' + (d ? badge(d.st) : '') + '</span><span class="li-sub">' + esc(sub) + '</span></div>' +
          '<button class="x-btn" data-act="rm" data-i="' + idx + '" aria-label="' + esc(it.s) + 'を取り消す">' + I.x + '</button></div>';
      }).join('') + '</div>';
  }
  if (notYet.length) {
    html += '<details class="card"' + (inv.items.length ? '' : ' open') + '><summary>まだ読み取っていない端末（' + notYet.length + '台）</summary><div class="list">' +
      notYet.map(function (d) { return '<div class="li"><div class="li-main"><span class="li-top"><span class="mono">' + esc(d.s) + '</span>' + badge(d.st) + '</span><span class="li-sub">' + esc(d.p || '') + (d.m ? '・' + esc(d.m) : '') + '</span></div></div>'; }).join('') +
      '</div></details>';
  }
  setView(html, '棚卸');
  acts.man = function () { invManual(); };
  acts.rm = function (el) {
    inv.items.splice(Number(el.getAttribute('data-i')), 1);
    inv.last = null;
    saveInv();
    render();
  };
  acts.finish = function () { go('invDone'); };
};

screens.invDone = function () {
  if (!st.inv) { go('home', null, { root: true }); return; }
  var inv = st.inv;
  var expected = invExpected();
  var scanned = {};
  inv.items.forEach(function (i) { scanned[i.s] = i; });
  var ok = [], moved = [], news = [], revive = [];
  inv.items.forEach(function (i) {
    var d = st.devices.get(i.s);
    if (!d) { news.push(i.s); return; }
    if (normKey(d.l) !== normKey(inv.location)) moved.push(d); else ok.push(d);
    var k = kindOf(d.st);
    if (k === '不明' || k === '移動') revive.push(d);
  });
  var missing = expected.filter(function (d) { return !scanned[d.s]; });
  var sel = inv.sel = inv.sel || { move: true, reg: true, revive: true, missing: false };
  var lost = statusByKind('不明');
  var html = '<div class="card"><div class="label">場所</div><div style="font-size:19px;font-weight:800">' + esc(inv.location) + '</div>' +
    '<dl class="kv"><dt>台帳どおり</dt><dd><b>' + ok.length + '台</b></dd><dt>読み取り合計</dt><dd>' + inv.items.length + '台</dd></dl></div>';
  var block = function (key, title, list, label, cls, fmt) {
    if (!list.length) return '';
    return '<div class="card"><div class="li-top" style="margin-bottom:6px"><span>' + title + '</span><span class="badge">' + list.length + '台</span></div>' +
      '<div class="li-sub" style="margin-bottom:6px">' + list.slice(0, 30).map(fmt).join('<br>') + (list.length > 30 ? '<br>ほか' + (list.length - 30) + '台' : '') + '</div>' +
      '<label class="check"><input type="checkbox" data-sel="' + key + '"' + (sel[key] ? ' checked' : '') + '><span>' + label + '</span></label></div>';
  };
  html += block('move', '別の場所で登録されていた端末', moved, 'この場所（' + esc(inv.location) + '）へ移動したことにする', 'moved',
    function (d) { return '<span class="mono">' + esc(d.s) + '</span>（台帳：' + esc(d.l) + '）'; });
  html += block('reg', '台帳にない端末', news, 'この場所の端末として登録する（' + esc(normalStatus()) + '）', 'new',
    function (s) { return '<span class="mono">' + esc(s) + '</span>' + (patternOk(s) ? '' : ' <b class="warn-text">形式が違います</b>'); });
  html += block('revive', '移動中・所在不明になっていた端末', revive, esc(normalStatus()) + 'に戻す', 'ok',
    function (d) { return '<span class="mono">' + esc(d.s) + '</span>（' + esc(d.st) + '）'; });
  if (lost) {
    html += block('missing', '見つからなかった端末', missing, '「' + esc(lost) + '」にする（本当に無いときだけ）', 'bad',
      function (d) { return '<span class="mono">' + esc(d.s) + '</span>（' + esc(d.st) + (d.p ? '・' + esc(d.p) : '') + '）'; });
  }
  if (!moved.length && !news.length && !missing.length) html += '<div class="note ok">' + I.check + '<div>台帳との違いはありません。</div></div>';
  html += '<div class="sticky-actions"><div class="stack"><button class="btn okb" data-act="commit">' + I.check + 'この内容で棚卸を確定する</button>' +
    '<button class="btn ghost" data-act="backInv">読み取りに戻る</button></div></div>';
  setView(html, '棚卸の確認');
  $$('input[data-sel]').forEach(function (cb) {
    cb.addEventListener('change', function () { sel[cb.getAttribute('data-sel')] = cb.checked; saveInv(); });
  });
  acts.backInv = function () { back(); };
  acts.commit = async function () {
    var news2 = news.filter(function (s) { return SERIAL_RE.test(s); });
    if (sel.reg && news2.some(function (s) { return !patternOk(s); })) {
      if (!(await confirmModal('形式の違う番号があります', '読み取りミスの可能性があります。このまま登録しますか？\n（登録しない場合は「読み取りに戻る」で×を押して外してください）', '登録する'))) return;
    }
    var payload = {
      location: inv.location,
      scanned: inv.items.map(function (i) { return i.s; }),
      move: sel.move ? moved.map(function (d) { return d.s; }) : [],
      register: sel.reg ? news2 : [],
      revive: sel.revive ? revive.map(function (d) { return d.s; }) : [],
      missing: sel.missing ? missing.map(function (d) { return d.s; }) : [],
      clientOpId: inv.opId || (inv.opId = newId())
    };
    saveInv();
    var r;
    try { r = await run(function () { return api('inventoryCommit', payload); }, '棚卸を保存しています…'); }
    catch (e) { return; }
    var loc = inv.location;
    st.inv = null;
    saveInv();
    try { await loadBoot(); } catch (e) { /* 後で更新 */ }
    addOp({ opId: r.opId, serial: '', title: '棚卸：' + loc, op: '確認' + r.counts.checked + '台', at: Date.now(), undoable: r.undoable });
    go('done', { kind: 'inv', opId: r.opId, counts: r.counts, warnings: r.warnings, location: loc }, { root: true });
  };
};

/* =========================================================
 * 画面：設定
 * ========================================================= */
function isIosSafariLike() {
  var ua = navigator.userAgent || '';
  return /iP(hone|ad|od)/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function isStandalone() {
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
}
function installCardHtml() {
  if (isStandalone()) return '';
  if (st.deferredInstall) {
    return '<div class="card"><div class="label">アプリとして使う</div>' +
      '<button class="btn primary" data-act="installApp">' + I.plus + 'ホーム画面に追加（インストール）</button>' +
      '<p class="hint" style="margin:10px 0 0">ホーム画面からワンタップで開けるようになります。</p></div>';
  }
  if (isIosSafariLike()) {
    return '<div class="card"><div class="label">アプリとして使う</div>' +
      '<p class="hint" style="margin:0">Safari の共有ボタンから「ホーム画面に追加」を選ぶと、ホーム画面からワンタップで開けるようになります。</p></div>';
  }
  return '';
}
screens.settings = function () {
  var modes = [
    { value: 'auto', label: 'おまかせ（おすすめ）', sub: '使える場合は「かざす」、使えない場合は「撮影」' },
    { value: 'photo', label: '撮影して読み取る', sub: 'カメラで撮った写真から読み取ります' },
    { value: 'live', label: 'かざして読み取る', sub: 'カメラ映像から自動で読み取ります（使えない環境あり）' }
  ];
  var html = '<div class="card"><div class="label">お名前</div><div class="li-top"><span style="font-size:18px">' + esc(st.user) + '</span><button class="btn small" data-act="rename">変更</button></div></div>' +
    '<div class="card"><div class="label">読み取り方法</div><div class="chips col">' +
    modes.map(function (m) { return '<button class="chip" data-act="mode" data-v="' + m.value + '" aria-pressed="' + (st.scanMode === m.value) + '"><span>' + esc(m.label) + '<small>' + esc(m.sub) + '</small></span></button>'; }).join('') +
    '</div><p class="hint" style="margin-bottom:0">いまの方法：' + (scanMode() === 'live' ? 'かざして読み取る' : '撮影して読み取る') + (Decoder.engine ? '（' + esc(Decoder.engine) + '）' : '') + '</p></div>' +
    installCardHtml() +
    '<div class="stack"><button class="btn" data-act="refresh">' + I.refresh + '最新の情報にする</button>' +
    '<button class="btn" data-act="testScan">' + I.camera + '読み取り機能を準備・確認する</button>' +
    '<button class="btn ghost" data-act="logout">合言葉を入力し直す（ログアウト）</button></div>' +
    '<p class="foot">バージョン ' + APP_VERSION + '・接続：' + ({ gas: 'Googleスプレッドシート', web: 'Googleスプレッドシート', mock: 'デモ（保存されません）' }[MODE] || MODE) +
    '<br>この端末のID：' + esc(st.deviceId.slice(0, 8)) + '・' + esc(deviceLabel()) + '</p>';
  setView(html, '設定');
  acts.mode = function (el) { st.scanMode = el.getAttribute('data-v'); st.liveFailed = false; store.set('scanMode', st.scanMode); render(); };
  acts.rename = function () {
    openModal('<h3>お名前の変更</h3><form id="nameForm"><input id="newName" type="text" maxlength="20" value="' + esc(st.user) + '" data-autofocus>' +
      '<div class="stack" style="margin-top:12px"><button class="btn primary" type="submit">保存</button><button class="btn ghost" type="button" data-act="close">やめる</button></div></form>',
      { close: function () { closeModal(); } });
    $('#nameForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var v = $('#newName').value.trim();
      if (!v) return;
      st.user = v; store.set('user', v); closeModal(); render(); toast('お名前を変更しました');
    });
  };
  acts.testScan = function () {
    run(function () { return Decoder.ready(); }, '読み取り機能を準備しています…').then(function () {
      alertModal('準備できました', '読み取り方式：' + Decoder.engine + '\nカメラ映像（かざす）：' + (liveAllowed() ? '使えます' : 'この画面では使えません（撮影で読み取ります）'));
      render();
    }, function () {});
  };
  acts.installApp = async function () {
    var ev = st.deferredInstall;
    if (!ev) return;
    st.deferredInstall = null;
    try { ev.prompt(); await ev.userChoice; } catch (err) { /* 中断されても問題なし */ }
    render();
  };
  acts.logout = async function () {
    if (!(await confirmModal('ログアウトしますか？', '次に開くときに合言葉の入力が必要になります。', 'ログアウト'))) return;
    st.token = ''; store.del('token');
    go('login', {}, { root: true });
  };
};

/* =========================================================
 * 起動
 * ========================================================= */
$('#btnBack').innerHTML = I.back;
$('#btnSettings').innerHTML = I.gear;
$('#btnBack').addEventListener('click', function () { back(); });
$('#btnSettings').addEventListener('click', function () { go('settings'); });
$('#tabHome').innerHTML = I.home + '<span>ホーム</span>';
$('#tabList').innerHTML = I.list + '<span>一覧</span>';
$('#tabSettings').innerHTML = I.gear + '<span>設定</span>';
$('#tabScan').innerHTML = I.camera;
$('#tabHome').addEventListener('click', function () { globalActs.goHome(); });
$('#tabList').addEventListener('click', function () { globalActs.goList(); });
$('#tabSettings').addEventListener('click', function () { go('settings'); });
$('#tabScan').addEventListener('click', function () { globalActs.scan(); });
if (MODE === 'gas' && google.script.history && google.script.history.setChangeHandler) google.script.history.setChangeHandler(onHistoryBack);
else window.addEventListener('popstate', onHistoryBack);
document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshBootQuietly(); });

/* PWA: Service Worker 登録とインストール促進 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* GAS配信時などは無視 */ }); });
}
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  st.deferredInstall = e;
  if (topName() === 'settings') render();
});
window.addEventListener('appinstalled', function () { st.deferredInstall = null; });

function readStartParams() {
  return new Promise(function (resolve) {
    var fallback = setTimeout(function () { resolve({}); }, 1500);
    try {
      if (MODE === 'gas' && google.script.url) {
        google.script.url.getLocation(function (loc) {
          clearTimeout(fallback);
          var p = (loc && loc.parameter) || {};
          resolve({ key: p.key || '', serial: p.s || '' });
        });
        return;
      }
      var q = new URLSearchParams(location.search);
      var h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
      clearTimeout(fallback);
      resolve({ key: h.get('key') || q.get('key') || '', serial: h.get('s') || q.get('s') || '' });
    } catch (e) { clearTimeout(fallback); resolve({}); }
  });
}
function clearStartParams() {
  try {
    if (MODE === 'gas' && google.script.history) google.script.history.replace(null, {}, '');
    else if (history.replaceState) history.replaceState(null, '', location.pathname);
  } catch (e) { /* 何もしない */ }
}

function loadDemo() {
  return new Promise(function (resolve) {
    var s = document.createElement('script');
    s.src = 'demo.js';
    s.onload = function () {
      if (typeof window.__startDemo__ !== 'function') { resolve(false); return; }
      Promise.resolve(window.__startDemo__()).then(function () { resolve(!!window.__MOCK_API__); }, function () { resolve(false); });
    };
    s.onerror = function () { resolve(false); };
    document.head.appendChild(s);
  });
}

async function start() {
  if (!IS_GAS && (!window.ITV_CONFIG || typeof window.ITV_CONFIG.API_URL !== 'string')) {
    go('error', { title: '接続設定を読み込めませんでした', message: '通信状態を確認して、もう一度読み込んでください。設定を確認できるまで登録はできません。', reload: true }, { root: true });
    return;
  }
  if (MODE === 'none') {
    var demoOk = await loadDemo();
    if (demoOk) {
      MODE = 'mock';
      window.ITV.MODE = MODE;
    } else {
      st.stack = [{ name: 'error', params: { title: '接続先が設定されていません', message: 'このページを外部に置く場合は、config.js の API_URL にGASのウェブアプリURLを入れてください。' } }];
      render();
      return;
    }
  }
  var p = await readStartParams();
  if (p.key || p.serial) clearStartParams();
  if (p.key && !st.token) {
    try { await run(function () { return login(p.key); }, '合言葉を確認しています…'); } catch (e) { /* ログイン画面へ */ }
  }
  if (!st.token) { go('login', {}, { root: true }); return; }
  try {
    showBusy('読み込み中…');
    await loadBoot();
  } catch (e) {
    hideBusy();
    if (e.code === 'AUTH') { handleError(e); return; }
    go('error', { title: ERROR_TITLES[e.code] || '読み込めませんでした', message: e.message }, { root: true });
    return;
  }
  hideBusy();
  if (!st.user) { go('login', {}, { root: true }); return; }
  go('home', null, { root: true });
  if (p.serial) openSerial(p.serial);
  setTimeout(function () { Decoder.ready().catch(function () { /* 必要なときに再試行 */ }); }, 1200);
}

window.ITV = { st: st, go: go, api: api, Decoder: Decoder, Live: Live, invAdd: invAdd, handleCodes: handleCodes, openSerial: openSerial, CONFIG: CONFIG, MODE: MODE };
start();
})();
</script>
